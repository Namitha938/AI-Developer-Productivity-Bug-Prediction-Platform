<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="heroBgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#8B5CF6" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Scan Beam Gradient -->
    <linearGradient id="scanBeamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.5" />
      <stop offset="40%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Line Pattern -->
    <pattern id="isoGrid" width="60" height="34.64" patternUnits="userSpaceOnUse">
      <path d="M 0 17.32 L 30 0 L 60 17.32 L 30 34.64 Z" fill="none" stroke="#6366F1" stroke-opacity="0.08" stroke-width="1" />
    </pattern>

    <!-- Building Color Gradients -->
    <!-- Safe (Teal) -->
    <linearGradient id="topTeal" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2DD4BF" /><stop offset="100%" stop-color="#14B8A6" /></linearGradient>
    <linearGradient id="leftTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0D9488" /><stop offset="100%" stop-color="#115E59" /></linearGradient>
    <linearGradient id="rightTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0F766E" /><stop offset="100%" stop-color="#134E4A" /></linearGradient>

    <!-- Normal (Indigo) -->
    <linearGradient id="topIndigo" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#818CF8" /><stop offset="100%" stop-color="#6366F1" /></linearGradient>
    <linearGradient id="leftIndigo" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4F46E5" /><stop offset="100%" stop-color="#3730A3" /></linearGradient>
    <linearGradient id="rightIndigo" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4338CA" /><stop offset="100%" stop-color="#312E81" /></linearGradient>

    <!-- Warning (Amber) -->
    <linearGradient id="topAmber" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FBBF24" /><stop offset="100%" stop-color="#F59E0B" /></linearGradient>
    <linearGradient id="leftAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D97706" /><stop offset="100%" stop-color="#B45309" /></linearGradient>
    <linearGradient id="rightAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#B45309" /><stop offset="100%" stop-color="#78350F" /></linearGradient>

    <!-- High Risk (Red) -->
    <linearGradient id="topRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F87171" /><stop offset="100%" stop-color="#EF4444" /></linearGradient>
    <linearGradient id="leftRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#DC2626" /><stop offset="100%" stop-color="#B91C1C" /></linearGradient>
    <linearGradient id="rightRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#B91C1C" /><stop offset="100%" stop-color="#7F1D1D" /></linearGradient>

    <!-- Heartbeat Glow -->
    <filter id="pulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowFilter" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="1200" height="620" rx="24" fill="#0F172A" />
  <rect width="1200" height="620" rx="24" fill="url(#heroBgGlow)" />
  <rect x="40" y="30" width="1120" height="510" fill="url(#isoGrid)" opacity="0.8" />

  <!-- Scanning Light Beam Overlay -->
  <path d="M 220 50 L 980 140 L 880 500 L 120 410 Z" fill="url(#scanBeamGrad)" opacity="0.35" />
  <line x1="220" y1="50" x2="120" y2="410" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="8 4" opacity="0.8" />
  <line x1="980" y1="140" x2="880" y2="500" stroke="#818CF8" stroke-width="1.5" opacity="0.4" />

  <!-- Codebase Isometric Platform Base -->
  <g transform="translate(600, 360)">
    <!-- Base Platform Slab -->
    <polygon points="0,-160 480,-20 0,120 -480,-20" fill="#1E293B" stroke="#334155" stroke-width="2" />
    <polygon points="-480,-20 0,120 0,140 -480,0" fill="#0F172A" />
    <polygon points="0,120 480,-20 480,0 0,140" fill="#1E1B4B" />

    <!-- Isometric Coordinate Helper Macro (dx, dy, width, height, H) -->
    
    <!-- 1. Low Risk Building A (Teal) - Background Left -->
    <g transform="translate(-280, -90)">
      <polygon points="0,-80 40,-60 40,0 0,-20" fill="url(#leftTeal)" />
      <polygon points="40,-60 80,-80 80,-20 40,0" fill="url(#rightTeal)" />
      <polygon points="0,-80 40,-100 80,-80 40,-60" fill="url(#topTeal)" />
    </g>

    <!-- 2. Normal Module Building B (Indigo) - Left Center -->
    <g transform="translate(-180, -130)">
      <polygon points="0,-120 50,-95 50,0 0,-25" fill="url(#leftIndigo)" />
      <polygon points="50,-95 100,-120 100,-25 50,0" fill="url(#rightIndigo)" />
      <polygon points="0,-120 50,-145 100,-120 50,-95" fill="url(#topIndigo)" />
    </g>

    <!-- 3. Safe Component C (Teal) - Mid Background -->
    <g transform="translate(-60, -170)">
      <polygon points="0,-90 45,-68 45,0 0,-22" fill="url(#leftTeal)" />
      <polygon points="45,-68 90,-90 90,-22 45,0" fill="url(#rightTeal)" />
      <polygon points="0,-90 45,-112 90,-90 45,-68" fill="url(#topTeal)" />
    </g>

    <!-- 4. Warning Module D (Amber) - Mid-Right Elevated -->
    <g transform="translate(80, -140)">
      <polygon points="0,-140 55,-112 55,0 0,-28" fill="url(#leftAmber)" />
      <polygon points="55,-112 110,-140 110,-28 55,0" fill="url(#rightAmber)" />
      <polygon points="0,-140 55,-168 110,-140 55,-112" fill="url(#topAmber)" />
    </g>

    <!-- 5. CRITICAL HIGH-RISK MONOLITH E (Red) - Center Focal Building -->
    <g transform="translate(-30, -50)" filter="url(#shadowFilter)">
      <!-- Building Body -->
      <polygon points="0,-220 70,-185 70,0 0,-35" fill="url(#leftRed)" />
      <polygon points="70,-185 140,-220 140,-35 70,0" fill="url(#rightRed)" />
      <polygon points="0,-220 70,-255 140,-220 70,-185" fill="url(#topRed)" />
      
      <!-- Luminous Edge Risk Beacon -->
      <line x1="70" y1="-255" x2="70" y2="0" stroke="#FCA5A5" stroke-width="2.5" opacity="0.9" />
      <circle cx="70" cy="-255" r="5" fill="#EF4444" />
      <circle cx="70" cy="-255" r="9" fill="#EF4444" opacity="0.4" />
    </g>

    <!-- 6. Normal Subsystem F (Indigo) - Foreground Left -->
    <g transform="translate(-240, -10)">
      <polygon points="0,-110 50,-85 50,0 0,-25" fill="url(#leftIndigo)" />
      <polygon points="50,-85 100,-110 100,-25 50,0" fill="url(#rightIndigo)" />
      <polygon points="0,-110 50,-135 100,-110 50,-85" fill="url(#topIndigo)" />
    </g>

    <!-- 7. Safe Helper G (Teal) - Foreground Mid-Left -->
    <g transform="translate(-110, 30)">
      <polygon points="0,-75 40,-55 40,0 0,-20" fill="url(#leftTeal)" />
      <polygon points="40,-55 80,-75 80,-20 40,0" fill="url(#rightTeal)" />
      <polygon points="0,-75 40,-95 80,-75 40,-55" fill="url(#topTeal)" />
    </g>

    <!-- 8. Warning Component H (Amber) - Center Foreground -->
    <g transform="translate(70, -20)">
      <polygon points="0,-130 50,-105 50,0 0,-25" fill="url(#leftAmber)" />
      <polygon points="50,-105 100,-130 100,-25 50,0" fill="url(#rightAmber)" />
      <polygon points="0,-130 50,-155 100,-130 50,-105" fill="url(#topAmber)" />
    </g>

    <!-- 9. Normal Core I (Indigo) - Right Foreground -->
    <g transform="translate(190, -70)">
      <polygon points="0,-100 45,-78 45,0 0,-22" fill="url(#leftIndigo)" />
      <polygon points="45,-78 90,-100 90,-22 45,0" fill="url(#rightIndigo)" />
      <polygon points="0,-100 45,-122 90,-100 45,-78" fill="url(#topIndigo)" />
    </g>

    <!-- 10. Safe Gateway J (Teal) - Far Right -->
    <g transform="translate(290, -110)">
      <polygon points="0,-85 40,-65 40,0 0,-20" fill="url(#leftTeal)" />
      <polygon points="40,-65 80,-85 80,-20 40,0" fill="url(#rightTeal)" />
      <polygon points="0,-85 40,-105 80,-85 40,-65" fill="url(#topTeal)" />
    </g>
  </g>

  <!-- Floating HUD Badges & Labels -->
  <!-- Badge 1: High Risk Over Monolith -->
  <g transform="translate(570, 75)" filter="url(#shadowFilter)">
    <rect width="190" height="48" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="1.5" />
    <circle cx="20" cy="24" r="5" fill="#EF4444" />
    <text x="34" y="21" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">payments/engine.py</text>
    <text x="34" y="37" fill="#F87171" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">Risk: 91.4% • Critical</text>
    <line x1="95" y1="48" x2="95" y2="70" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3 3" />
  </g>

  <!-- Badge 2: Safe Module Badge -->
  <g transform="translate(260, 220)" filter="url(#shadowFilter)">
    <rect width="170" height="44" rx="10" fill="#1E293B" stroke="#14B8A6" stroke-width="1.5" />
    <circle cx="18" cy="22" r="5" fill="#14B8A6" />
    <text x="32" y="19" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">auth/token.go</text>
    <text x="32" y="35" fill="#2DD4BF" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">Risk: 8.2% • Safe</text>
  </g>

  <!-- Badge 3: Warning Module Badge -->
  <g transform="translate(790, 190)" filter="url(#shadowFilter)">
    <rect width="180" height="44" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5" />
    <circle cx="18" cy="22" r="5" fill="#F59E0B" />
    <text x="32" y="19" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">cache/redis.rs</text>
    <text x="32" y="35" fill="#FBBF24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500">Risk: 54.0% • Warning</text>
  </g>

  <!-- Bottom Pulse ECG / Heartbeat Line Across Hero Bottom -->
  <g transform="translate(0, 560)">
    <!-- Base track line -->
    <line x1="60" y1="0" x2="1140" y2="0" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Heartbeat glowing waveform -->
    <path d="M 60 0 L 320 0 L 340 -12 L 355 14 L 375 -32 L 395 24 L 415 -8 L 430 0 L 680 0 L 700 -18 L 720 30 L 740 -45 L 760 22 L 775 -10 L 790 0 L 1140 0" 
          fill="none" 
          stroke="#4F46E5" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#pulseGlow)" />
          
    <path d="M 60 0 L 320 0 L 340 -12 L 355 14 L 375 -32 L 395 24 L 415 -8 L 430 0 L 680 0 L 700 -18 L 720 30 L 740 -45 L 760 22 L 775 -10 L 790 0 L 1140 0" 
          fill="none" 
          stroke="#38BDF8" 
          stroke-width="1.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Pulse nodes -->
    <circle cx="375" cy="-32" r="4" fill="#38BDF8" />
    <circle cx="740" cy="-45" r="4.5" fill="#818CF8" />
    <text x="60" y="24" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500">SYSTEM TELEMETRY: REAL-TIME REPOSITORY AUDIT STREAM</text>
    <text x="1140" y="24" text-anchor="end" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600">● 100% SARIF 2.1.0 COMPLIANT</text>
  </g>
</svg>

